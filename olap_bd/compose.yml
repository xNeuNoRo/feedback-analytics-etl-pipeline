services:
  postgres_olap:
    image: postgres:18-alpine
    container_name: olap_bd
    restart: unless-stopped # Reinicia el contenedor solo si se detiene por error, no manualmente.
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=olap_dev
    networks:
      - bigdata_project_network
    ports:
      - "5434:5432"
    volumes:
      - ./.postgres_data/main:/var/lib/postgresql/18/docker
      - ./.postgres_data/dimensions:/mnt/tablespaces/dimensions
      - ./.postgres_data/facts:/mnt/tablespaces/facts
      - ./.postgres_data/indexes:/mnt/tablespaces/indexes
      # Ojo, todos los scripts sql de inicializacion estan en esta misma ruta 
      # (carpeta db_scripts) y solo se van a ejecutar 1 sola vez al crear el container
      - ./db_scripts:/docker-entrypoint-initdb.d/
    # Comando para crear los directorios de los tablespaces y darle permisos a postgres antes de iniciar
    command: >
      bash -c "mkdir -p /mnt/tablespaces/dimensions /mnt/tablespaces/facts /mnt/tablespaces/indexes &&
      chown -R postgres:postgres /mnt/tablespaces &&
      docker-entrypoint.sh postgres"